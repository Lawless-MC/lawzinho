name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: pnpm/action-setup@v6.1.0
              with:
                  run_install: true
                  cache: true

            - name: Lint
              run: pnpm lint

            - name: Format
              run: pnpm format

            - name: Type check
              run: pnpm typecheck

            - name: Build
              run: pnpm build
